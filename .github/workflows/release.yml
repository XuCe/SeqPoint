name: release

# 打 tag 时构建全平台并发布到 Releases。
# 也可手动触发（workflow_dispatch）先跑一遍，验证流水线本身。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '预演用的版本号，如 v0.1.0-test（不会创建 Release）'
        required: false
        default: 'v0.0.0-dev'

# 构建只读；发布 job 单独授予写权限。
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'
  SHOREBIRD_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
  # 产物统一命名：seqpoint-<版本>-<平台>.<后缀>
  APP_NAME: seqpoint
  RELEASE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  # ── 先跑一遍检查，任何一项不过就不浪费后面的构建时间 ──
  verify:
    name: 检查与测试
    runs-on: ubuntu-latest
    env:
      SEQPOINT_SYNCTHING_BIN: ${{ github.workspace }}/native/syncthing/artifacts/syncthing
      SEQPOINT_NODE_BINARY: ${{ github.workspace }}/seqpoint-node-test
    steps:
      - uses: actions/checkout@v4

      - name: 校验发布版本与配置
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          WINSPARKLE_PRIVATE_KEY: ${{ secrets.WINSPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" && test -n "$WINSPARKLE_PRIVATE_KEY" || { echo '::error::缺少完整更新签名 Secrets'; exit 1; }
          [[ "$RELEASE_LABEL" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo '::error::版本标签格式无效'; exit 1; }
          version=$(sed -n 's/^version: //p' apps/seqpoint_app/pubspec.yaml)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v${version%+*}" ]; then
            echo '::error::Tag 必须与 pubspec.yaml 版本一致'; exit 1
          fi
          test -f apps/seqpoint_app/shorebird.yaml
          test -n "$SHOREBIRD_TOKEN" || { echo '::error::缺少 SHOREBIRD_TOKEN'; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./.github/actions/syncthing
        with:
          platform: linux
      - name: 校验原生许可资产
        run: |
          python3 native/syncthing/collect_licenses.py
          git diff --exit-code -- apps/seqpoint_app/assets/licenses/syncthing.txt
      - name: 原生引擎测试
        working-directory: native/syncthing
        run: go test -tags noassets ./mobile && go vet -tags noassets ./...
      - name: 节点测试与集成测试程序
        working-directory: node
        run: go test ./... && go build -o "$SEQPOINT_NODE_BINARY" .

      - name: 完整更新元数据测试
        run: python3 scripts/updates/test_appcast.py

      - name: 密钥扫描
        run: scripts/scan_secrets.sh

      - name: 准备回环 TLS 测试证书
        run: bash scripts/prepare_test_tls.sh

      - name: 解析依赖
        run: dart pub get

      - name: 核心层分析与测试
        run: cd packages/seqpoint_core && dart analyze && dart test

      - name: 应用层分析与测试
        run: cd apps/seqpoint_app && flutter analyze && flutter test

  # ── Android：只出 AArch64 与 ARMv7 两个 ABI ──
  android:
    name: Android (arm64 + armv7)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./.github/actions/syncthing
        with:
          platform: android
      - run: dart pub get

      - name: 注入发布签名
        # 正式发布必须签名；预演允许未配置签名时编译验证。
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] \
             || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo '::error::正式发布需要完整 Android 签名 Secrets'; exit 1
            fi
            echo "::warning::未配置 Android 签名 Secret，本次将使用 debug 签名，产物不可上架"
            exit 0
          fi
          cd apps/seqpoint_app/android
          echo "$KEYSTORE_BASE64" | base64 -d > seqpoint-release.jks
          umask 077
          cat > key.properties <<EOF
          storeFile=seqpoint-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已注入发布签名"

      - name: 构建支持热更新的 APK
        working-directory: apps/seqpoint_app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        # Shorebird 不支持 split-per-abi，使用包含两个 ARM ABI 的 APK。
        run: |
          shorebird release android --artifact apk \
            --flutter-version "$FLUTTER_VERSION" $SHOREBIRD_DRY_RUN \
            --target-platform android-arm,android-arm64

      - name: 清理密钥材料
        if: always()
        run: rm -f apps/seqpoint_app/android/seqpoint-release.jks \
                   apps/seqpoint_app/android/key.properties

      - name: 校验产物确实用发布密钥签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secret，跳过校验"; exit 0
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=apps/seqpoint_app/build/app/outputs/flutter-apk/app-release.apk
          out=$("$apksigner" verify --print-certs "$apk")
          echo "$out" | grep -i "certificate DN"
          # debug 签名会带 "CN=Android Debug"，出现即说明密钥没注入成功
          if echo "$out" | grep -q "CN=Android Debug"; then
            echo "::error::产物用的是 debug 签名，发布密钥未生效"; exit 1
          fi

      - name: 整理产物
        run: |
          mkdir -p dist
          v="$RELEASE_LABEL"
          src=apps/seqpoint_app/build/app/outputs/flutter-apk
          cp "$src/app-release.apk" "dist/${APP_NAME}-${v}-android.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          retention-days: 7

  # iOS 先编译未签名归档；不发布不可安装的正式热更新基线。
  ios:
    name: iOS (unsigned archive)
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/syncthing
        with:
          platform: ios
      - run: dart pub get
      - name: 编译未签名归档（不上传基线）
        working-directory: apps/seqpoint_app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release ios --flutter-version "$FLUTTER_VERSION" --no-codesign --dry-run
      - name: 打包未签名归档
        run: |
          mkdir -p dist
          archive_dir=apps/seqpoint_app/build/ios/archive
          archives=("$archive_dir"/*.xcarchive)
          test "${#archives[@]}" -eq 1 && test -d "${archives[0]}"
          ditto -c -k --keepParent "${archives[0]}" "dist/${APP_NAME}-${RELEASE_LABEL}-ios-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ── macOS arm64：Apple Silicon runner ──
  macos:
    name: macOS (arm64)
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./.github/actions/syncthing
        with:
          platform: macos
      - run: dart pub get

      - name: 准备 macOS 自签名身份
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          # GitHub-hosted VMs are discarded after each job; never use a persistent runner.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -n "$MACOS_SIGNING_P12_BASE64" && test -n "$MACOS_SIGNING_PASSWORD"
          keychain="$RUNNER_TEMP/seqpoint-signing.keychain-db"
          bundle="$RUNNER_TEMP/seqpoint-signing.p12"
          certificate="apps/seqpoint_app/macos/signing/seqpoint-certificate.pem"
          keychain_password="$(openssl rand -hex 24)"
          python3 -c 'import base64,os,sys; open(sys.argv[1],"wb").write(base64.b64decode(os.environ["MACOS_SIGNING_P12_BASE64"],validate=True))' "$bundle"
          chmod 600 "$bundle"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$bundle" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$certificate"
          security list-keychains -d user > "$RUNNER_TEMP/seqpoint-previous-keychains.txt"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity="$(openssl x509 -in "$certificate" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          security find-identity -v -p codesigning "$keychain" | grep -F "$identity"
          printf 'FLUTTER_XCODE_CODE_SIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          rm -f "$bundle"

      - name: 构建
        working-directory: apps/seqpoint_app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
        run: shorebird release macos --flutter-version "$FLUTTER_VERSION" $SHOREBIRD_DRY_RUN

      - name: 清理临时签名身份
        if: always()
        run: |
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo '自托管运行器未导入签名身份，跳过清理。'
            exit 0
          fi
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          errors = []
          def run(label, command):
              print('清理：' + label, flush=True)
              try:
                  subprocess.run(command, check=True, timeout=30)
              except (subprocess.SubprocessError, OSError) as error:
                  errors.append(label)
                  print(f'{label}未完成: {type(error).__name__}', flush=True)
          try:
              (root / 'seqpoint-signing.p12').unlink(missing_ok=True)
          except OSError:
              errors.append('删除P12')
          previous = root / 'seqpoint-previous-keychains.txt'
          try:
              if previous.exists():
                  run('恢复钥匙串列表', ['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(previous.read_text())])
          except (OSError, ValueError):
              errors.append('读取钥匙串列表')
          keychain = root / 'seqpoint-signing.keychain-db'
          if keychain.exists():
              run('删除临时钥匙串', ['security', 'delete-keychain', str(keychain)])
          if errors:
              sys.exit('签名身份清理失败: ' + ', '.join(errors))
          PY

      - name: 验证 macOS 签名身份
        run: |
          app="apps/seqpoint_app/build/macos/Build/Products/Release/${APP_NAME}_app.app"
          identity="$(printf '%s' "$FLUTTER_XCODE_CODE_SIGN_IDENTITY" | tr '[:upper:]' '[:lower:]')"
          codesign -d -r- "$app" 2>&1 | tr '[:upper:]' '[:lower:]' | grep -F "certificate leaf = h\"$identity\""
          codesign --verify --deep --strict "$app"

      - name: 打包为 DMG
        run: |
          v="$RELEASE_LABEL"
          mkdir -p dist staging
          cp -R "apps/seqpoint_app/build/macos/Build/Products/Release/${APP_NAME}_app.app" staging/序点.app
          # 拖到"应用程序"安装的常规布局
          ln -s /Applications staging/Applications
          hdiutil create -volname "序点 SeqPoint" \
            -srcfolder staging -ov -format UDZO \
            "dist/${APP_NAME}-${v}-macos-arm64.dmg"
          ls -lh dist

      - name: 签名完整更新包并生成 macOS 更新信息
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version=$(sed -n 's/^version: //p' apps/seqpoint_app/pubspec.yaml)
          python3 scripts/updates/appcast.py --platform macos \
            --version "$version" --tag "$RELEASE_LABEL" \
            --asset "dist/${APP_NAME}-${RELEASE_LABEL}-macos-arm64.dmg" \
            --output "dist/${APP_NAME}-${RELEASE_LABEL}-appcast-macos.xml"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          retention-days: 7

  # ── Windows x64 ──
  windows:
    name: Windows (x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./.github/actions/syncthing
        with:
          platform: windows
      - run: dart pub get

      - name: 构建
        working-directory: apps/seqpoint_app
        shell: pwsh
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          $flags = @()
          if ($env:SHOREBIRD_DRY_RUN) { $flags += $env:SHOREBIRD_DRY_RUN }
          shorebird release windows --flutter-version $env:FLUTTER_VERSION @flags

      - name: 打包为 zip
        shell: pwsh
        run: |
          $v = $env:RELEASE_LABEL
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = 'apps/seqpoint_app/build/windows/x64/runner/Release'
          Compress-Archive -Path "$src/*" -DestinationPath "dist/$env:APP_NAME-$v-windows-x64.zip"
          Get-ChildItem dist

      - name: 制作 Windows 安装器并签名更新信息
        shell: pwsh
        env:
          WINSPARKLE_PRIVATE_KEY: ${{ secrets.WINSPARKLE_PRIVATE_KEY }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (!(Get-Command openssl -ErrorAction SilentlyContinue)) {
            choco install openssl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'OpenSSL installation failed' }
            $env:PATH += ';C:/Program Files/OpenSSL-Win64/bin'
          }
          $version = ((Get-Content apps/seqpoint_app/pubspec.yaml | Select-String '^version:').Line -replace '^version:\s*', '').Trim()
          $displayVersion = $version.Split('+')[0]
          $src = (Resolve-Path 'apps/seqpoint_app/build/windows/x64/runner/Release').Path
          $out = (Resolve-Path dist).Path
          & $iscc /Q "/DMyAppVersion=$displayVersion" "/DSourceDir=$src" "/O$out" "/F$env:APP_NAME-$env:RELEASE_LABEL-windows-x64-setup" scripts/updates/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          python scripts/updates/appcast.py --platform windows --version $version --tag $env:RELEASE_LABEL --asset "dist/$env:APP_NAME-$env:RELEASE_LABEL-windows-x64-setup.exe" --output "dist/$env:APP_NAME-$env:RELEASE_LABEL-appcast-windows.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Update signing failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          retention-days: 7

  # ── Ubuntu arm64：GitHub 的 arm64 Linux runner ──
  # 公共仓库免费；私有仓库需要付费方案，否则这个 job 会排不到机器。
  linux:
    name: Linux (arm64)
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev \
            libnotify-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libkeybinder-3.0-dev
        # 各依赖对应：GTK 壳、flutter_secure_storage(libsecret)、
        # tray_manager(appindicator)、flutter_local_notifications_linux(libnotify)、audioplayers(GStreamer)

      - name: 安装固定版本 Flutter（Linux arm64）
        # 官方没有该架构的 SDK 压缩包，从相同版本 tag 引导 Dart/engine。
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" precache --linux

      - uses: ./.github/actions/syncthing
        with:
          platform: linux
      - run: dart pub get

      - name: 构建
        working-directory: apps/seqpoint_app
        run: flutter build linux --release

      - name: 打包为 tar.gz
        run: |
          v="$RELEASE_LABEL"
          mkdir -p dist
          tar -czf "dist/${APP_NAME}-${v}-linux-arm64.tar.gz" \
            -C apps/seqpoint_app/build/linux/arm64/release/bundle .
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          retention-days: 7

  # ── 汇总并发布 ──
  release:
    name: 发布到 Releases
    needs: [android, ios, macos, windows, linux]
    # 只有打 tag 才真的发布；手动触发仅验证流水线。
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物并生成校验和
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 本版本

            - 局域网双向同步：电脑出示二维码供手机扫描，也可输入手机的 IP:端口，核对短码并允许后同步。
            - Syncthing 跨网同步：先局域网配对，再填写 NAS 管理地址与 API Key，应用自动授权共享加密目录。
            - Android、macOS、Windows 支持应用内下载并安装完整更新；系统要求的安装确认仍需用户操作。
            - 使用新版序点图标，客户端标题显示“序点＋版本号”。

            手机需保持应用在前台同步。使用步骤见 [设备同步说明](https://github.com/XuCe/SeqPoint/blob/${{ github.ref_name }}/docs/device-sync.md)。
            v0.1.0 不含本次所需的原生引擎、权限与完整更新器，需先完整安装本版本；不能仅靠热更新补丁升级。

            ## 下载

            | 平台 | 文件 |
            |---|---|
            | Android（arm64 / armv7） | `*-android.apk` |
            | iOS（未签名，仅供后续签名） | `*-ios-unsigned.xcarchive.zip` |
            | macOS（Apple 芯片） | `*-macos-arm64.dmg` |
            | Windows 64 位（推荐，可自动更新） | `*-windows-x64-setup.exe` |
            | Windows 便携版 | `*-windows-x64.zip` |
            | Linux ARM64 | `*-linux-arm64.tar.gz` |

            `SHA256SUMS.txt` 用于校验下载完整性。`*-appcast-*.xml` 供应用原生更新器使用。
            完整更新会在应用内下载并启动安装；Windows 建议先使用安装器安装。

            > iOS 归档不能直接安装，需后续签名及分发；macOS 使用自签名，未经 Apple 公证，Windows 暂未做分发签名。
            > macOS 首次打开需在「系统设置 → 隐私与安全性」中允许，
            > Windows 会出现 SmartScreen 提示，Android 需允许安装未知来源应用。
