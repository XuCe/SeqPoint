name: ci

on: [push, pull_request]

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: scripts/scan_secrets.sh
      - run: bash scripts/prepare_test_tls.sh
      - run: dart pub get
      - name: 核心层分析与单测
        run: cd packages/seqpoint_core && dart analyze && dart test
      - name: 应用层分析与测试
        run: cd apps/seqpoint_app && flutter analyze && flutter test

  build-apple:
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: dart pub get
      - run: cd apps/seqpoint_app && flutter build macos --debug
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
      - run: cd apps/seqpoint_app && flutter build ios --debug --no-codesign

  build-android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: dart pub get
      - run: cd apps/seqpoint_app && flutter build apk --debug

  build-windows:
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: dart pub get
      - run: cd apps/seqpoint_app; flutter build windows --debug
