name: seqpoint_app
description: 序点 SeqPoint —— 让每件事，都有顺序。
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  audioplayers: ^6.8.1
  archive: ^4.5.2
  desktop_multi_window: ^0.3.1
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_local_notifications_windows: ^3.1.1
  flutter_secure_storage: ^10.3.1
  home_widget: ^0.9.4
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.5.1
  path_provider: ^2.1.6
  quick_actions: ^1.1.0
  record: ^7.1.2
  receive_sharing_intent: ^1.9.0
  seqpoint_core:
    path: ../../packages/seqpoint_core
  seqpoint_platform:
    path: ../../packages/seqpoint_platform
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  speech_to_text: ^7.5.0
  timezone: ^0.11.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  package_info_plus: ^9.0.1
  pub_semver: ^2.2.1
  auto_updater: ^1.0.0
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^5.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/tray/
