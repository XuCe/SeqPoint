name: seqpoint-relay
services:
  node:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ./node.json
        target: /config/node.json
        read_only: true
        bind:
          create_host_path: false
      - node_data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [node]
    environment:
      SEQPOINT_DOMAIN: ${SEQPOINT_DOMAIN:?Set SEQPOINT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  node_data:
  caddy_data:
  caddy_config:
